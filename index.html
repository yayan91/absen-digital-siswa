<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABSEN DIGITAL SISWA</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    /* Touch-friendly tap targets for mobile */
    @media (max-width: 768px) {
      button, input, select {
        min-height: 44px;
      }
    }
    
    /* Smooth scrolling for better mobile UX */
    html {
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="h-full w-full overflow-auto bg-gradient-to-br from-blue-50 to-indigo-100"></div>
  <script>
    const defaultConfig = {
      app_title: "ABSEN DIGITAL SISWA",
      school_name: "Nama Sekolah Anda",
      primary_color: "#3B82F6",
      secondary_color: "#FFFFFF",
      text_color: "#1F2937",
      header_color: "#1E40AF",
      button_color: "#10B981"
    };

    let config = { ...defaultConfig };

    // Local Storage Keys
    const STORAGE_KEYS = {
      CLASSES: 'attendance_classes',
      STUDENTS: 'attendance_students',
      ATTENDANCE: 'attendance_records'
    };

    // Initialize data from localStorage
    let classes = JSON.parse(localStorage.getItem(STORAGE_KEYS.CLASSES)) || [];
    let students = JSON.parse(localStorage.getItem(STORAGE_KEYS.STUDENTS)) || [];
    let attendanceRecords = JSON.parse(localStorage.getItem(STORAGE_KEYS.ATTENDANCE)) || [];

    // Current view state
    let currentView = 'home'; // home, classList, studentList, attendance, reports, settings
    let selectedClassId = null;
    let reportType = null; // 'class' or 'student'
    let selectedStudentId = null;

    // Settings data
    let settings = JSON.parse(localStorage.getItem('app_settings'));
    
    // Inisialisasi settings jika belum ada atau password tidak ada
    if (!settings || !settings.password) {
      settings = {
        schoolName: 'Nama Sekolah Anda',
        teachers: [],
        appTeacher: { name: '', nip: '' },
        password: '123456'
      };
      localStorage.setItem('app_settings', JSON.stringify(settings));
    }

    function saveSettings() {
      localStorage.setItem('app_settings', JSON.stringify(settings));
    }

    // Login state
    let isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

    function login(password) {
      if (password === settings.password) {
        isLoggedIn = true;
        localStorage.setItem('isLoggedIn', 'true');
        renderApp();
        return true;
      }
      return false;
    }

    function logout() {
      isLoggedIn = false;
      localStorage.removeItem('isLoggedIn');
      currentView = 'home';
      renderApp();
    }

    function saveToLocalStorage() {
      localStorage.setItem(STORAGE_KEYS.CLASSES, JSON.stringify(classes));
      localStorage.setItem(STORAGE_KEYS.STUDENTS, JSON.stringify(students));
      localStorage.setItem(STORAGE_KEYS.ATTENDANCE, JSON.stringify(attendanceRecords));
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function getTodaySummary() {
      const today = new Date().toISOString().split('T')[0];
      
      if (classes.length === 0) {
        return `
          <div class="text-center py-8" style="color: ${config.text_color}; opacity: 0.7">
            <div class="text-5xl mb-3">📚</div>
            <p>Belum ada kelas. Silakan tambahkan kelas terlebih dahulu.</p>
          </div>
        `;
      }
      
      return classes.map(cls => {
        const classStudents = getStudentsByClass(cls.id);
        const todayAttendance = attendanceRecords.filter(r => r.classId === cls.id && r.date === today);
        
        const present = todayAttendance.filter(r => r.status === 'present').length;
        const sick = todayAttendance.filter(r => r.status === 'sick').length;
        const permit = todayAttendance.filter(r => r.status === 'permit').length;
        const absent = todayAttendance.filter(r => r.status === 'absent').length;
        const notYet = classStudents.length - todayAttendance.length;
        
        return `
          <div class="border-2 rounded-lg p-4" style="border-color: ${config.primary_color}">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h4 class="text-lg font-bold" style="color: ${config.text_color}">${cls.name}</h4>
                <p class="text-sm" style="color: ${config.text_color}; opacity: 0.7">${classStudents.length} Siswa</p>
              </div>
              ${todayAttendance.length === 0 ? `
                <span class="px-3 py-1 rounded-full bg-gray-200 text-gray-700 text-sm font-medium">Belum Absen</span>
              ` : todayAttendance.length === classStudents.length ? `
                <span class="px-3 py-1 rounded-full text-white text-sm font-medium" style="background-color: ${config.button_color}">✓ Selesai</span>
              ` : `
                <span class="px-3 py-1 rounded-full bg-yellow-100 text-yellow-700 text-sm font-medium">Belum Lengkap</span>
              `}
            </div>
            <div class="grid grid-cols-5 gap-2 text-center text-sm">
              <div class="p-2 rounded bg-green-50">
                <div class="font-bold text-lg text-green-600">${present}</div>
                <div class="text-green-800">Hadir</div>
              </div>
              <div class="p-2 rounded bg-yellow-50">
                <div class="font-bold text-lg text-yellow-600">${sick}</div>
                <div class="text-yellow-800">Sakit</div>
              </div>
              <div class="p-2 rounded bg-orange-50">
                <div class="font-bold text-lg text-orange-600">${permit}</div>
                <div class="text-orange-800">Izin</div>
              </div>
              <div class="p-2 rounded bg-red-50">
                <div class="font-bold text-lg text-red-600">${absent}</div>
                <div class="text-red-800">Alpa</div>
              </div>
              <div class="p-2 rounded bg-gray-50">
                <div class="font-bold text-lg text-gray-600">${notYet}</div>
                <div class="text-gray-800">Belum</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function formatDate(date) {
      const d = new Date(date);
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}/${month}/${year}`;
    }

    function addClass(name, grade, teacherId) {
      const teacher = settings.teachers.find(t => t.id === teacherId);
      const newClass = {
        id: generateId(),
        name: name,
        grade: grade,
        teacherId: teacherId || null,
        teacherName: teacher ? teacher.name : '',
        teacherNip: teacher ? teacher.nip : '',
        createdAt: new Date().toISOString()
      };
      classes.push(newClass);
      saveToLocalStorage();
      return newClass;
    }

    function deleteClass(classId) {
      classes = classes.filter(c => c.id !== classId);
      students = students.filter(s => s.classId !== classId);
      attendanceRecords = attendanceRecords.filter(a => a.classId !== classId);
      saveToLocalStorage();
    }

    function addStudent(classId, name, nisn, gender) {
      const newStudent = {
        id: generateId(),
        classId: classId,
        name: name,
        nisn: nisn,
        gender: gender,
        createdAt: new Date().toISOString()
      };
      students.push(newStudent);
      saveToLocalStorage();
      return newStudent;
    }

    function deleteStudent(studentId) {
      students = students.filter(s => s.id !== studentId);
      attendanceRecords = attendanceRecords.filter(a => a.studentId !== studentId);
      saveToLocalStorage();
    }

    function getStudentsByClass(classId) {
      return students.filter(s => s.classId === classId);
    }

    function saveAttendance(classId, date, attendanceData) {
      const dateKey = new Date(date).toISOString().split('T')[0];
      
      attendanceData.forEach(item => {
        const existingIndex = attendanceRecords.findIndex(
          r => r.classId === classId && r.studentId === item.studentId && r.date === dateKey
        );

        const record = {
          id: existingIndex >= 0 ? attendanceRecords[existingIndex].id : generateId(),
          classId: classId,
          studentId: item.studentId,
          date: dateKey,
          status: item.status,
          note: item.note || '',
          createdAt: existingIndex >= 0 ? attendanceRecords[existingIndex].createdAt : new Date().toISOString()
        };

        if (existingIndex >= 0) {
          attendanceRecords[existingIndex] = record;
        } else {
          attendanceRecords.push(record);
        }
      });

      saveToLocalStorage();
    }

    function getAttendanceByClassAndDate(classId, date) {
      const dateKey = new Date(date).toISOString().split('T')[0];
      return attendanceRecords.filter(r => r.classId === classId && r.date === dateKey);
    }

    function getCurrentDate() {
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const now = new Date();
      return `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
    }

    function renderApp() {
      const app = document.getElementById('app');
      
      // Login screen
      if (!isLoggedIn) {
        app.innerHTML = `
          <div class="min-h-full flex items-center justify-center p-6 bg-gradient-to-br from-blue-50 to-indigo-100">
            <div class="max-w-md w-full">
              <!-- Header Date -->
              <div class="text-center mb-4">
                <p class="text-sm font-medium" style="color: ${config.text_color}; opacity: 0.8">
                  ${getCurrentDate()}
                </p>
              </div>

              <div class="bg-white rounded-2xl shadow-2xl p-8">
                <div class="text-center mb-6">
                  <div class="text-6xl mb-4">🎓</div>
                  <h1 class="text-3xl font-bold mb-2" style="color: ${config.header_color}">ABSEN DIGITAL SISWA</h1>
                  <p class="text-lg font-medium" style="color: ${config.primary_color}">Sistem Absensi Digital</p>
                </div>

                <div class="mb-6 p-4 rounded-lg bg-blue-50 border-2 border-blue-200">
                  <h3 class="font-bold text-blue-900 mb-2">• Fitur Aplikasi:</h3>
                  <ul class="text-sm text-blue-800 space-y-1">
                    <li>• Kelola data kelas dan siswa</li>
                    <li>• Absensi harian yang mudah</li>
                    <li>• Rekap absensi per kelas dan siswa</li>
                    <li>• Export ke PDF & Excel</li>
                    <li>• Pengaturan sekolah dan guru</li>
                  </ul>
                </div>

                <form onsubmit="handleLogin(event)" class="space-y-4">
                  <div>
                    <label for="loginPassword" class="block mb-2 font-medium" style="color: ${config.text_color}">Masukkan Password</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-3 border-2 rounded-lg focus:outline-none focus:ring-2 text-lg" style="border-color: ${config.primary_color}" placeholder="••••••">
                  </div>
                  <button type="submit" class="w-full py-3 rounded-lg font-bold text-white text-lg hover:opacity-90 transition-opacity" style="background-color: ${config.button_color}">
                    Masuk →
                  </button>
                  <p class="text-xs text-center" style="color: ${config.text_color}; opacity: 0.6">
                    Password default: 123456 (dapat diubah di Pengaturan)
                  </p>
                </form>
              </div>

              <!-- Footer -->
              <div class="text-center mt-6">
                <p class="text-sm" style="color: ${config.text_color}; opacity: 0.7">
                  Dikembangkan oleh <span class="font-bold">Muhammad Hasratul</span>
                </p>
                <p class="text-xs mt-1" style="color: ${config.text_color}; opacity: 0.6">
                  © ${new Date().getFullYear()} - All Rights Reserved
                </p>
              </div>
            </div>
          </div>
        `;
        return;
      }
      
      if (currentView === 'home') {
        app.innerHTML = `
          <div class="min-h-full p-6">
            <!-- Header Date -->
            <div class="max-w-4xl mx-auto mb-4 flex justify-between items-center">
              <p class="text-sm font-medium" style="color: ${config.text_color}; opacity: 0.8">
                📅 ${getCurrentDate()}
              </p>
              <button onclick="logout()" class="text-sm font-medium px-4 py-2 rounded-lg hover:opacity-80 transition-opacity" style="background-color: ${config.secondary_color}; color: ${config.text_color}; border: 2px solid ${config.primary_color}">
                ← Keluar
              </button>
            </div>

            <header class="text-center mb-8 bg-white rounded-xl shadow-lg p-8">
              <h1 class="text-5xl font-bold mb-2" style="color: ${config.header_color}">${config.app_title}</h1>
              <p class="text-xl" style="color: ${config.text_color}">${settings.schoolName}</p>
            </header>

            <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
              <button onclick="navigateTo('classList')" class="bg-white rounded-xl shadow-lg p-8 hover:shadow-xl transition-all transform hover:scale-105" style="border-left: 6px solid ${config.primary_color}">
                <div class="text-6xl mb-4">📚</div>
                <h2 class="text-2xl font-bold mb-2" style="color: ${config.text_color}">Kelola Kelas</h2>
                <p style="color: ${config.text_color}; opacity: 0.7">Tambah dan kelola data kelas</p>
              </button>

              <button onclick="navigateTo('attendance')" class="bg-white rounded-xl shadow-lg p-8 hover:shadow-xl transition-all transform hover:scale-105" style="border-left: 6px solid ${config.button_color}">
                <div class="text-6xl mb-4">✅</div>
                <h2 class="text-2xl font-bold mb-2" style="color: ${config.text_color}">Input Kehadiran</h2>
                <p style="color: ${config.text_color}; opacity: 0.7">Lakukan absensi harian</p>
              </button>

              <button onclick="navigateTo('reports')" class="bg-white rounded-xl shadow-lg p-8 hover:shadow-xl transition-all transform hover:scale-105" style="border-left: 6px solid #8B5CF6">
                <div class="text-6xl mb-4">📊</div>
                <h2 class="text-2xl font-bold mb-2" style="color: ${config.text_color}">Rekap Absensi</h2>
                <p style="color: ${config.text_color}; opacity: 0.7">Lihat dan download laporan</p>
              </button>

              <button onclick="navigateTo('settings')" class="bg-white rounded-xl shadow-lg p-8 hover:shadow-xl transition-all transform hover:scale-105" style="border-left: 6px solid #6366F1">
                <div class="text-6xl mb-4">⚙️</div>
                <h2 class="text-2xl font-bold mb-2" style="color: ${config.text_color}">Pengaturan</h2>
                <p style="color: ${config.text_color}; opacity: 0.7">Kelola sekolah dan guru</p>
              </button>
            </div>

            <div class="max-w-4xl mx-auto mt-8 bg-white rounded-xl shadow-lg p-6">
              <h3 class="text-2xl font-bold mb-4" style="color: ${config.text_color}">📅 Kehadiran Hari Ini</h3>
              <div id="todaySummary" class="space-y-3 max-h-96 overflow-y-auto pr-2">
                ${getTodaySummary()}
              </div>
            </div>

            <!-- Footer -->
            <div class="max-w-4xl mx-auto mt-8 text-center">
              <p class="text-sm" style="color: ${config.text_color}; opacity: 0.7">
                Dikembangkan oleh <span class="font-bold">Muhammad Hasratul</span>
              </p>
              <p class="text-xs mt-1" style="color: ${config.text_color}; opacity: 0.6">
                © ${new Date().getFullYear()} - All Rights Reserved
              </p>
            </div>
          </div>
        `;
      } else if (currentView === 'classList') {
        renderClassList();
      } else if (currentView === 'studentList') {
        renderStudentList();
      } else if (currentView === 'attendance') {
        renderAttendance();
      } else if (currentView === 'reports') {
        renderReports();
      } else if (currentView === 'settings') {
        renderSettings();
      }
    }

    function renderClassList() {
      const app = document.getElementById('app');
      
      app.innerHTML = `
        <div class="min-h-full p-6">
          <div class="max-w-4xl mx-auto">
            <div class="flex items-center justify-between mb-6">
              <button onclick="navigateTo('home')" class="px-4 py-2 rounded-lg font-medium hover:opacity-80 transition-opacity" style="background-color: ${config.secondary_color}; color: ${config.text_color}; border: 2px solid ${config.primary_color}">
                ← Kembali
              </button>
              <h2 class="text-3xl font-bold" style="color: ${config.header_color}">Kelola Kelas</h2>
              <button onclick="showAddClassForm()" class="px-6 py-2 rounded-lg font-medium text-white hover:opacity-90 transition-opacity" style="background-color: ${config.button_color}">
                + Tambah Kelas
              </button>
            </div>

            <div id="classFormContainer" class="hidden mb-6 bg-white rounded-xl shadow-lg p-6">
              <h3 class="text-xl font-bold mb-4" style="color: ${config.text_color}">Tambah Kelas Baru</h3>
              <form onsubmit="handleAddClass(event)" class="space-y-4">
                <div>
                  <label for="className" class="block mb-2 font-medium" style="color: ${config.text_color}">Nama Kelas</label>
                  <input type="text" id="className" required class="w-full px-4 py-2 border-2 rounded-lg focus:outline-none focus:ring-2" style="border-color: ${config.primary_color}" placeholder="Contoh: 7A">
                </div>
                <div>
                  <label for="classGrade" class="block mb-2 font-medium" style="color: ${config.text_color}">Tingkat</label>
                  <select id="classGrade" required class="w-full px-4 py-2 border-2 rounded-lg focus:outline-none focus:ring-2" style="border-color: ${config.primary_color}">
                    <option value="7">Kelas 7</option>
                    <option value="8">Kelas 8</option>
                    <option value="9">Kelas 9</option>
                    <option value="10">Kelas 10</option>
                    <option value="11">Kelas 11</option>
                    <option value="12">Kelas 12</option>
                  </select>
                </div>
                <div>
                  <label for="classTeacher" class="block mb-2 font-medium" style="color: ${config.text_color}">Wali Kelas</label>
                  <select id="classTeacher" class="w-full px-4 py-2 border-2 rounded-lg focus:outline-none focus:ring-2" style="border-color: ${config.primary_color}">
                    <option value="">-- Pilih Wali Kelas --</option>
                    ${settings.teachers.map(teacher => `
                      <option value="${teacher.id}">${teacher.name} (NIP: ${teacher.nip})</option>
                    `).join('')}
                  </select>
                  ${settings.teachers.length === 0 ? `
                    <p class="text-sm mt-1" style="color: ${config.text_color}; opacity: 0.7">
                      Belum ada data guru. <a href="#" onclick="event.preventDefault(); navigateTo('settings')" class="underline font-medium" style="color: ${config.primary_color}">Tambah guru</a> di menu Pengaturan.
                    </p>
                  ` : ''}
                </div>
                <div class="flex gap-3">
                  <button type="submit" class="px-6 py-2 rounded-lg font-medium text-white hover:opacity-90 transition-opacity" style="background-color: ${config.button_color}">
                    Simpan
                  </button>
                  <button type="button" onclick="hideAddClassForm()" class="px-6 py-2 rounded-lg font-medium hover:opacity-80 transition-opacity" style="background-color: ${config.secondary_color}; color: ${config.text_color}; border: 2px solid ${config.primary_color}">
                    Batal
                  </button>
                </div>
              </form>
            </div>

            <div id="classListContainer" class="space-y-4">
              ${classes.length === 0 ? `
                <div class="text-center py-12 bg-white rounded-xl shadow-lg">
                  <div class="text-6xl mb-4">📚</div>
                  <p class="text-xl" style="color: ${config.text_color}">Belum ada kelas. Tambahkan kelas pertama Anda!</p>
                </div>
              ` : classes.map(cls => {
                const classStudents = getStudentsByClass(cls.id);
                return `
                  <div class="bg-white rounded-xl shadow-lg p-4 md:p-6 hover:shadow-xl transition-shadow">
                    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                      <div class="flex-1">
                        <h3 class="text-xl md:text-2xl font-bold mb-1" style="color: ${config.text_color}">${cls.name}</h3>
                        <p class="text-sm md:text-base" style="color: ${config.text_color}; opacity: 0.7">Tingkat ${cls.grade} • ${classStudents.length} Siswa</p>
                        ${cls.teacherName ? `
                          <p class="mt-2 text-sm md:text-base" style="color: ${config.text_color}; opacity: 0.9">
                            <span class="font-medium">👨 Wali Kelas:</span> ${cls.teacherName}
                            ${cls.teacherNip ? ` <span class="text-xs md:text-sm" style="opacity: 0.7">(NIP: ${cls.teacherNip})</span>` : ''}
                          </p>
                        ` : ''}
                      </div>
                      <div class="flex gap-2 md:gap-3">
                        <button onclick="viewStudents('${cls.id}')" class="flex-1 md:flex-initial px-3 py-2 md:px-4 md:py-2 text-sm md:text-base rounded-lg font-medium text-white hover:opacity-90 transition-opacity" style="background-color: ${config.primary_color}">
                          Siswa
                        </button>
                        <button onclick="showEditClassForm('${cls.id}')" class="flex-1 md:flex-initial px-3 py-2 md:px-4 md:py-2 text-sm md:text-base rounded-lg font-medium text-white bg-yellow-500 hover:bg-yellow-600 transition-colors">
                          Edit
                        </button>
                        <button onclick="confirmDeleteClass('${cls.id}')" class="flex-1 md:flex-initial px-3 py-2 md:px-4 md:py-2 text-sm md:text-base rounded-lg font-medium text-white bg-red-500 hover:bg-red-600 transition-colors">
                          Hapus
                        </button>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderStudentList() {
      const app = document.getElementById('app');
      const currentClass = classes.find(c => c.id === selectedClassId);
      const classStudents = getStudentsByClass(selectedClassId);
      
      app.innerHTML = `
        <div class="min-h-full p-6">
          <div class="max-w-4xl mx-auto">
            <div class="flex items-center justify-between mb-6">
              <button onclick="navigateTo('classList')" class="px-4 py-2 rounded-lg font-medium hover:opacity-80 transition-opacity" style="background-color: ${config.secondary_color}; color: ${config.text_color}; border: 2px solid ${config.primary_color}">
                ← Kembali
              </button>
              <h2 class="text-3xl font-bold" style="color: ${config.header_color}">Siswa Kelas ${currentClass.name}</h2>
              <div class="flex gap-2">
                <button onclick="showAddStudentForm()" class="px-4 py-2 rounded-lg font-medium text-white hover:opacity-90 transition-opacity" style="background-color: ${config.button_color}">
                  + Manual
                </button>
                <button onclick="showImportExcelForm()" class="px-4 py-2 rounded-lg font-medium text-white hover:opacity-90 transition-opacity" style="background-color: ${config.primary_color}">
                  📊 Excel
                </button>
              </div>
            </div>

              </div>

            ${classStudents.length === 0 ? `

                <div class="text-6xl mb-4">👥</div>
                <p class="text-xl mb-4" style="color: ${config.text_color}">Belum ada siswa di kelas ini</p>
                <button onclick="viewStudents('${selectedClassId}')" class="px-6 py-3 rounded-lg font-medium text-white hover:opacity-90 transition-opacity" style="background-color: ${config.primary_color}">
                  Tambah Siswa
                </button>
              </div>
            ` : `
              <div id="attendanceList" class="space-y-3">
                ${classStudents.map((student, index) => {
                  const existingRecord = todayAttendance.find(r => r.studentId === student.id);

                  return `

                      <div class="flex items-center justify-between mb-3">

                            ${index + 1}
                          </div>
                          <div>
                            <h4 class="font-bold text-lg" style="color: ${config.text_color}">${student.name}</h4>
                            <p class="text-sm" style="color: ${config.text_color}; opacity: 0.7">NISN: ${student.nisn} • ${student.gender === 'L' ? '👨' : '👩'}</p>

                        </button>

                        </button>

                        </button>

                        </button>
                      </div>
                      <input type="text" placeholder="Catatan (opsional)" value="${note}" onchange="setAttendanceNote('${student.id}', this.value)" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2" style="border-color: ${config.primary_color}">

    let attendanceData = {};

    function setAttendanceStatus(studentId, status) {
      if (!attendanceData[studentId]) {
        attendanceData[studentId] = {};
      }
      attendanceData[studentId].status = status;

      const studentCard = document.querySelector(`[data-student-id="${studentId}"]`);
      const buttons = studentCard.querySelectorAll('.status-btn');
      
      buttons.forEach(btn => {
        btn.classList.remove('text-white', 'bg-yellow-500', 'bg-orange-500', 'bg-red-500');
        btn.classList.add('bg-gray-100');
        btn.style.backgroundColor = '';
      });

      const activeBtn = Array.from(buttons).find(btn => {
        const btnText = btn.textContent.toLowerCase();
        return (status === 'present' && btnText.includes('hadir')) ||
               (status === 'sick' && btnText.includes('sakit')) ||
               (status === 'permit' && btnText.includes('izin')) ||
               (status === 'absent' && btnText.includes('alpa'));
      });

      if (activeBtn) {
        activeBtn.classList.remove('bg-gray-100');
        activeBtn.classList.add('text-white');
        
        if (status === 'present') {
          activeBtn.style.backgroundColor = config.button_color;
        } else if (status === 'sick') {
          activeBtn.classList.add('bg-yellow-500');
        } else if (status === 'permit') {
          activeBtn.classList.add('bg-orange-500');
        } else if (status === 'absent') {
          activeBtn.classList.add('bg-red-500');
        }
      }

      updateAttendanceCounts();
    }

    function setAttendanceNote(studentId, note) {
      if (!attendanceData[studentId]) {
        attendanceData[studentId] = { status: 'present' };
      }
      attendanceData[studentId].note = note;
    }

    function updateAttendanceCounts() {
      const classStudents = getStudentsByClass(selectedClassId);
      const counts = { present: 0, sick: 0, permit: 0, absent: 0 };

      classStudents.forEach(student => {
        const status = attendanceData[student.id]?.status || 'present';
        counts[status]++;
      });

      const presentEl = document.getElementById('presentCount');
      const sickEl = document.getElementById('sickCount');
      const permitEl = document.getElementById('permitCount');
      const absentEl = document.getElementById('absentCount');

      if (presentEl) presentEl.textContent = counts.present;
      if (sickEl) sickEl.textContent = counts.sick;
      if (permitEl) permitEl.textContent = counts.permit;
      if (absentEl) absentEl.textContent = counts.absent;
    }

    function changeAttendanceDate(newDate) {
      selectedAttendanceDate = newDate;
      attendanceData = {};
      
      const dateAttendance = getAttendanceByClassAndDate(selectedClassId, selectedAttendanceDate);
      dateAttendance.forEach(record => {
        attendanceData[record.studentId] = {
          status: record.status,
          note: record.note
        };
      });
      
      renderAttendanceForm();
    }

    function saveAttendanceData() {
      const classStudents = getStudentsByClass(selectedClassId);
      const selectedDate = new Date(selectedAttendanceDate);
      const dataToSave = [];

      classStudents.forEach(student => {
        const data = attendanceData[student.id] || { status: 'present', note: '' };
        dataToSave.push({
          studentId: student.id,
          status: data.status,
          note: data.note || ''
        });
      });

      saveAttendance(selectedClassId, selectedDate, dataToSave);

      const successMsg = document.createElement('div');
      successMsg.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg';
      successMsg.textContent = '✓ Absensi berhasil disimpan!';
      document.body.appendChild(successMsg);

      setTimeout(() => {
        successMsg.remove();
      }, 3000);
    }

    function navigateTo(view) {
      currentView = view;
      if (view !== 'attendance') {
        selectedClassId = null;
        attendanceData = {};
      }
      renderApp();
    }

    function showAddClassForm() {
      document.getElementById('classFormContainer').classList.remove('hidden');

    function hideAddClassForm() {
      document.getElementById('classFormContainer').classList.add('hidden');

      document.getElementById('classGrade').value = '7';
      document.getElementById('classTeacher').value = '';
      
      // Reset form to add mode

      form.onsubmit = handleAddClass;
      document.querySelector('#classFormContainer h3').textContent = 'Tambah Kelas Baru';

    function showEditClassForm(classId) {
      editingClassId = classId;
      const cls = classes.find(c => c.id === classId);
      
      document.getElementById('classFormContainer').classList.remove('hidden');
      document.getElementById('className').value = cls.name;
      document.getElementById('classGrade').value = cls.grade;
      document.getElementById('classTeacher').value = cls.teacherId || '';
      
      // Change form title and submit handler

      form.onsubmit = handleEditClass;
      
      // Scroll to form
      document.getElementById('classFormContainer').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function handleEditClass(event) {
      event.preventDefault();
      const name = document.getElementById('className').value.trim();
      const grade = document.getElementById('classGrade').value;
      const teacherId = document.getElementById('classTeacher').value;
      
      if (name && grade && editingClassId) {
        const classIndex = classes.findIndex(c => c.id === editingClassId);
        if (classIndex !== -1) {
          const teacher = settings.teachers.find(t => t.id === teacherId);
          classes[classIndex].name = name;
          classes[classIndex].grade = grade;
          classes[classIndex].teacherId = teacherId || null;
          classes[classIndex].teacherName = teacher ? teacher.name : '';
          classes[classIndex].teacherNip = teacher ? teacher.nip : '';
          
          saveToLocalStorage();
          showNotification('✓ Data kelas berhasil diperbarui!');
          editingClassId = null;
          hideAddClassForm();
          renderClassList();
        }
      }
    }

      const name = document.getElementById('className').value.trim();
      const grade = document.getElementById('classGrade').value;
      const teacherId = document.getElementById('classTeacher').value;
      
      if (name) {
        addClass(name, grade, teacherId);
        hideAddClassForm();
        renderClassList();

    function handleEditStudent(event) {
      event.preventDefault();
      const name = document.getElementById('studentName').value.trim();
      const nisn = document.getElementById('studentNisn').value.trim();
      const gender = document.getElementById('studentGender').value;
      
      if (name && nisn && gender && editingStudentId) {
        const studentIndex = students.findIndex(s => s.id === editingStudentId);
        if (studentIndex !== -1) {
          students[studentIndex].name = name;
          students[studentIndex].nisn = nisn;
          students[studentIndex].gender = gender;
          
          saveToLocalStorage();
          showNotification('✓ Data siswa berhasil diperbarui!');

    function showImportExcelForm() {
      document.getElementById('studentFormContainer').classList.add('hidden');
      document.getElementById('importExcelContainer').classList.remove('hidden');
      
      const fileInput = document.getElementById('excelFile');
      fileInput.addEventListener('change', previewExcelData);

    function hideImportExcelForm() {
      document.getElementById('importExcelContainer').classList.add('hidden');
      document.getElementById('excelFile').value = '';
      document.getElementById('previewContainer').classList.add('hidden');
    }

    let importedStudentsData = [];

    function previewExcelData(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
          
          // Skip header row and process data
          importedStudentsData = [];
          const previewHTML = [];
          
          for (let i = 1; i < jsonData.length; i++) {
            const row = jsonData[i];
            if (row[0] && row[1]) { // Name and NISN must exist
              const name = String(row[0]).trim();
              const nisn = String(row[1]).trim();
              const gender = String(row[2] || 'L').toUpperCase().trim();
              
              if (gender !== 'L' && gender !== 'P') {
                previewHTML.push(`<div class="p-2 bg-red-50 rounded text-sm text-red-700">❌ Baris ${i + 1}: ${name} - Jenis kelamin harus L atau P</div>`);
                continue;
              }
              
              importedStudentsData.push({ name, nisn, gender });
              previewHTML.push(`<div class="p-2 bg-green-50 rounded text-sm">✓ ${name} - NISN: ${nisn} - ${gender === 'L' ? 'Laki-laki' : 'Perempuan'}</div>`);
            }
          }
          
          if (importedStudentsData.length > 0) {
            document.getElementById('previewContainer').classList.remove('hidden');
            document.getElementById('previewContent').innerHTML = previewHTML.join('');
          } else {
            showNotification('⚠️ Tidak ada data valid di file Excel!');
          }
        } catch (error) {
          showNotification('❌ Gagal membaca file Excel!');
          console.error(error);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function updateAppTeacher(event) {

      const nip = document.getElementById('appTeacherNip').value.trim();
      if (name && nip) {
        settings.appTeacher = { name, nip };
        saveSettings();
        showNotification('✓ Data guru berhasil diperbarui!');
        renderSettings();
      }

    function showAddTeacherForm() {
      document.getElementById('teacherFormContainer').classList.remove('hidden');

    function hideAddTeacherForm() {
      document.getElementById('teacherFormContainer').classList.add('hidden');
      document.getElementById('teacherName').value = '';
      document.getElementById('teacherNip').value = '';
      
      // Reset form to add mode
      const form = document.querySelector('#teacherFormContainer form');
      form.onsubmit = handleAddTeacher;
      document.querySelector('#teacherFormContainer h4').textContent = 'Tambah Guru Baru';
    }

    function handleAddTeacher(event) {
      event.preventDefault();
      const name = document.getElementById('teacherName').value.trim();
      const nip = document.getElementById('teacherNip').value.trim();
      
      if (name && nip) {
        settings.teachers.push({ id: generateId(), name, nip });
        saveSettings();
        hideAddTeacherForm();
        showNotification('✓ Guru berhasil ditambahkan!');
        renderSettings();
      }
    }

    let editingTeacherIndex = null;

    function showEditTeacherForm(index) {
      editingTeacherIndex = index;
      const teacher = settings.teachers[index];
      
      document.getElementById('teacherFormContainer').classList.remove('hidden');
      document.getElementById('teacherName').value = teacher.name;
      document.getElementById('teacherNip').value = teacher.nip;
      
      // Change form title and submit handler
      document.querySelector('#teacherFormContainer h4').textContent = 'Edit Data Guru';
      const form = document.querySelector('#teacherFormContainer form');
      form.onsubmit = handleEditTeacher;
      
      // Scroll to form
      document.getElementById('teacherFormContainer').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function handleEditTeacher(event) {
      event.preventDefault();
      const name = document.getElementById('teacherName').value.trim();
      const nip = document.getElementById('teacherNip').value.trim();
      
      if (name && nip && editingTeacherIndex !== null) {
        settings.teachers[editingTeacherIndex].name = name;
        settings.teachers[editingTeacherIndex].nip = nip;
        
        // Update classes that use this teacher
        const teacherId = settings.teachers[editingTeacherIndex].id;
        classes.forEach(cls => {
          if (cls.teacherId === teacherId) {
            cls.teacherName = name;
            cls.teacherNip = nip;
          }
        });
        
        saveSettings();
        saveToLocalStorage();
        showNotification('✓ Data guru berhasil diperbarui!');
        editingTeacherIndex = null;
        hideAddTeacherForm();
        renderSettings();
      }
    }

    function deleteTeacher(index) {
      const teacher = settings.teachers[index];
      
      const confirmMsg = document.createElement('div');
      confirmMsg.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';

    function handleLogin(event) {
      event.preventDefault();

      // Debug: tampilkan password yang dimasukkan dan password yang disimpan
      console.log('Password yang dimasukkan:', password);
      console.log('Password yang tersimpan:', settings.password);
      
      if (login(password)) {
        // Login berhasil, tidak perlu showNotification karena akan langsung render
      } else {
        const loginPassword = document.getElementById('loginPassword');
        loginPassword.value = '';
        loginPassword.style.borderColor = '#EF4444';
        
        const errorMsg = document.createElement('div');
        errorMsg.className = 'fixed top-4 right-4 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg z-50';

    function updatePassword(event) {
      event.preventDefault();
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (currentPassword !== settings.password) {
        showNotification('❌ Password saat ini salah!');
        return;
      }
      
      if (newPassword.length < 6) {
        showNotification('❌ Password baru minimal 6 karakter!');
        return;
      }
      
      if (newPassword !== confirmPassword) {
        showNotification('❌ Konfirmasi password tidak cocok!');
        return;
      }
      
      settings.password = newPassword;
      saveSettings();
      
      document.getElementById('currentPassword').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('confirmPassword').value = '';
      
      showNotification('✓ Password berhasil diubah!');
    }

    function backupData() {
      const backupData = {
        version: '1.0',
        timestamp: new Date().toISOString(),
        settings: settings,
        classes: classes,
        students: students,
        attendanceRecords: attendanceRecords
      };
      
      const dataStr = JSON.stringify(backupData, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);
      
      const link = document.createElement('a');
      link.href = url;
      link.download = `Backup_Absensi_${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      
      showNotification('✓ Backup data berhasil didownload!');
    }

    function showRestoreForm() {
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
      modal.innerHTML = `
        <div class="bg-white rounded-xl p-6 max-w-md mx-4 w-full">
          <h3 class="text-xl font-bold mb-4" style="color: ${config.text_color}">Restore Data</h3>
          <p class="mb-4 text-sm" style="color: ${config.text_color}; opacity: 0.8">Pilih file backup (format .json) untuk mengembalikan data</p>
          <div class="mb-4 p-4 rounded-lg bg-yellow-50 border border-yellow-200">
            <p class="text-sm text-yellow-800">⚠️ <strong>Perhatian:</strong> Proses restore akan mengganti semua data yang ada saat ini!</p>
          </div>
          <form onsubmit="handleRestore(event)" class="space-y-4">
            <div>
              <label for="restoreFile" class="block mb-2 font-medium" style="color: ${config.text_color}">Pilih File Backup</label>
              <input type="file" id="restoreFile" accept=".json" required class="w-full px-4 py-2 border-2 rounded-lg focus:outline-none focus:ring-2" style="border-color: ${config.primary_color}">
            </div>
            <div class="flex gap-3">
              <button type="submit" class="flex-1 px-4 py-2 rounded-lg font-medium text-white hover:opacity-90 transition-opacity bg-green-600">
                Restore
              </button>
              <button type="button" onclick="this.closest('.fixed').remove()" class="flex-1 px-4 py-2 rounded-lg font-medium hover:opacity-80 transition-opacity" style="background-color: ${config.secondary_color}; color: ${config.text_color}; border: 2px solid ${config.primary_color}">
                Batal
              </button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function handleRestore(event) {
      event.preventDefault();
      const fileInput = document.getElementById('restoreFile');
      const file = fileInput.files[0];
      
      if (!file) {
        showNotification('⚠️ Pilih file backup terlebih dahulu!');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const backupData = JSON.parse(e.target.result);
          
          // Validate backup data structure
          if (!backupData.version || !backupData.settings || !backupData.classes || !backupData.students || !backupData.attendanceRecords) {
            showNotification('❌ File backup tidak valid!');
            return;
          }
          
          // Restore data
          settings = backupData.settings;
          classes = backupData.classes;
          students = backupData.students;
          attendanceRecords = backupData.attendanceRecords;
          
          // Save to localStorage
          saveSettings();
          saveToLocalStorage();
          
          // Close modal
          document.querySelector('.fixed.inset-0').remove();
          
          showNotification('✓ Data berhasil direstore!');
          
          // Refresh display after 1 second
          setTimeout(() => {
            renderApp();
          }, 1000);
        } catch (error) {
          showNotification('❌ Gagal membaca file backup!');
          console.error(error);
        }
      };
      reader.readAsText(file);
    }

    function executeDeleteAllData() {
      const confirmText = document.getElementById('confirmText').value;
      
      if (confirmText !== 'HAPUS') {
        showNotification('❌ Konfirmasi tidak sesuai! Ketik HAPUS dengan huruf kapital.');
        return;
      }
      
      // Clear all data
      classes = [];
      students = [];
      attendanceRecords = [];
      settings.teachers = [];
      
      // Save to localStorage
      saveSettings();
      saveToLocalStorage();
      
      // Close modal
      document.querySelector('.fixed.inset-0').remove();
      
      showNotification('✓ Semua data berhasil dihapus!');
      
      // Refresh display
      setTimeout(() => {
        renderApp();
      }, 1000);
    }

    async function onConfigChange(newConfig) {
      const elements = {
        appTitle: document.querySelectorAll('h1'),
        schoolName: document.querySelectorAll('p'),
        headerColor: document.querySelectorAll('[style*="color"]'),
        buttons: document.querySelectorAll('button'),
        primaryElements: document.querySelectorAll('[style*="background-color"]')
      };

      elements.appTitle.forEach(el => {
        if (el.textContent.includes(config.app_title)) {
          el.textContent = newConfig.app_title || defaultConfig.app_title;
        }
      });

      config = { ...config, ...newConfig };
      renderApp();
    }

          ["school_name", cfg.school_name || defaultConfig.school_name]
        ])
      });
    }

    renderApp();
